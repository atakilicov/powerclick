name: Feature request
description: Suggest something PowerClick should do.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please search [existing issues](https://github.com/atakilicov/powerclick/issues?q=is%3Aissue+label%3Aenhancement) first. If someone already asked for it, add a 👍 reaction there instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe what you're doing in Finder when you hit this, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like PowerClick to do?
  - type: dropdown
    id: frequency
    attributes:
      label: How often do you hit this problem?
      options:
        - Several times a day
        - About once a day
        - A few times a week
        - A few times a month
        - Rarely
